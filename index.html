<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeTrack — Prototipe Karya Inovasi Pendidikan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0F141B;
    --surface: #171F29;
    --surface-2: #1E2833;
    --border: #2A3543;
    --text: #EDEFF3;
    --text-muted: #8B93A3;
    --text-dim: #5C6675;
    --pemula: #4FBFAE;
    --pemula-soft: rgba(79,191,174,0.14);
    --menengah: #E8A23C;
    --menengah-soft: rgba(232,162,60,0.14);
    --lanjut: #B98CE0;
    --lanjut-soft: rgba(185,140,224,0.14);
    --error: #E2735A;
    --error-soft: rgba(226,115,90,0.13);
    --brand: #E8A23C;
    --radius: 14px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    line-height: 1.5;
  }
  h1,h2,h3, .display, .brand, button, .nav-pill, .badge, .stat-num{
    font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  }
  code, pre, .mono, .eyebrow{
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  ::selection{ background: var(--brand); color:#10151C; }

  #app{ max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

  /* Header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 30px; gap: 16px; flex-wrap: wrap;
  }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .brandmark .dot{
    width: 30px; height:30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--brand), var(--lanjut));
    display:flex; align-items:center; justify-content:center;
    font-size: 15px; font-weight:700; color:#10151C;
  }
  .brand{ font-weight:700; font-size: 18px; letter-spacing: -0.01em; }
  .brand span{ color: var(--text-dim); font-weight: 500; font-size: 12px; display:block; margin-top:-2px; letter-spacing: 0.02em;}

  .nav{ display:flex; gap:6px; background: var(--surface); padding:4px; border-radius: 999px; border:1px solid var(--border);}
  .nav-pill{
    border:none; background:transparent; color: var(--text-muted);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight:600;
    cursor:pointer; transition: all .15s ease;
  }
  .nav-pill.active{ background: var(--brand); color: #10151C; }
  .nav-pill:not(.active):hover{ color: var(--text); }

  .info-btn{
    width: 34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background: var(--surface); color:var(--text-muted); cursor:pointer; font-weight:700;
    font-family:'Space Grotesk',sans-serif; font-size:14px;
  }
  .info-btn:hover{ color: var(--brand); border-color: var(--brand); }

  /* Info Panel */
  .info-panel{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding: 20px 22px; margin-bottom: 26px;
  }
  .info-panel h3{ margin: 0 0 10px; font-size:15px; color: var(--brand);}
  .info-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-top: 14px;}
  .info-card{ background: var(--surface-2); border-radius:10px; padding:12px 14px; border:1px solid var(--border);}
  .info-card .eyebrow{ font-size:10.5px; color: var(--brand); letter-spacing:0.06em; text-transform:uppercase;}
  .info-card p{ margin: 6px 0 0; font-size: 12.5px; color: var(--text-muted); line-height:1.5;}

  /* Hero / landing */
  .hero{
    background: radial-gradient(120% 140% at 15% 0%, rgba(232,162,60,0.10), transparent 55%), var(--surface);
    border:1px solid var(--border); border-radius: 20px; padding: 40px 34px; margin-bottom: 22px;
    position: relative; overflow:hidden;
  }
  .eyebrow{ font-size:11px; letter-spacing:0.08em; color: var(--brand); text-transform:uppercase; font-weight:600;}
  .hero h1{ font-size: 32px; margin: 10px 0 12px; line-height:1.15; max-width: 560px;}
  .hero p{ color: var(--text-muted); max-width: 480px; font-size: 14.5px; margin-bottom: 22px;}
  .btn-primary{
    background: var(--brand); color:#10151C; border:none; padding: 13px 24px; border-radius: 10px;
    font-weight:700; font-size:14px; cursor:pointer; transition: transform .12s ease, opacity .12s;
  }
  .btn-primary:hover{ transform: translateY(-1px); opacity:.92;}
  .btn-secondary{
    background: transparent; color: var(--text); border:1px solid var(--border); padding: 12px 22px;
    border-radius: 10px; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .btn-secondary:hover{ border-color: var(--text-dim); }

  .feature-row{ display:grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-top: 26px;}
  .feature{ background: var(--surface); border:1px solid var(--border); border-radius: 12px; padding: 16px;}
  .feature .icon{ font-size: 18px; margin-bottom:8px; display:block;}
  .feature h4{ margin:0 0 4px; font-size: 13.5px;}
  .feature p{ margin:0; font-size:12px; color: var(--text-muted); line-height:1.5;}

  /* Diagnostic */
  .card{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 28px;}
  .diag-progress{ display:flex; gap:6px; margin-bottom: 20px;}
  .diag-dot{ flex:1; height:4px; border-radius: 3px; background: var(--surface-2);}
  .diag-dot.done{ background: var(--brand);}
  .diag-dot.current{ background: var(--text-dim);}
  .diag-step-label{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;}
  .q-text{ font-size:17px; font-weight:600; margin: 4px 0 18px; line-height:1.4;}
  .codeblock{
    background:#0B0F14; border:1px solid var(--border); border-radius:10px; padding:16px 18px;
    font-size:13px; color:#C9D3DE; overflow-x:auto; margin-bottom:18px; white-space:pre;
  }
  .codeblock .kw{ color:#E8A23C; } .codeblock .str{ color:#4FBFAE;} .codeblock .cm{ color:#5C6675;}
  .opt-list{ display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
    padding: 13px 16px; border-radius: 10px; cursor:pointer; font-size: 13.5px; font-family:inherit;
    transition: all .12s ease; display:flex; align-items:center; gap:10px;
  }
  .opt:hover{ border-color: var(--brand); }
  .opt .letter{
    width:22px; height:22px; border-radius:6px; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--text-dim); flex-shrink:0;
  }
  .opt.correct{ border-color: var(--pemula); background: var(--pemula-soft); }
  .opt.correct .letter{ background: var(--pemula); color:#0B0F14; border-color:var(--pemula);}
  .opt.wrong{ border-color: var(--error); background: var(--error-soft); }
  .opt.wrong .letter{ background: var(--error); color:#0B0F14; border-color:var(--error);}
  .opt.disabled{ pointer-events:none; opacity: .55; }
  .opt.locked-pick{ pointer-events:none; }

  /* Result */
  .result-badge{
    display:inline-flex; align-items:center; gap:8px; padding: 7px 16px; border-radius: 999px;
    font-weight:700; font-size:13px; margin-bottom:16px;
  }
  .level-pemula .result-badge, .badge-pemula{ background: var(--pemula-soft); color: var(--pemula); }
  .level-menengah .result-badge, .badge-menengah{ background: var(--menengah-soft); color: var(--menengah); }
  .level-lanjut .result-badge, .badge-lanjut{ background: var(--lanjut-soft); color: var(--lanjut); }

  /* Track view */
  .level-tabs{ display:flex; gap:8px; margin-bottom: 22px; flex-wrap:wrap; }
  .level-tab{
    border:1px solid var(--border); background: var(--surface); color: var(--text-muted);
    padding: 9px 16px; border-radius: 10px; font-size:13px; font-weight:600; cursor:pointer; position:relative;
  }
  .level-tab.active-pemula{ border-color: var(--pemula); color: var(--pemula); background: var(--pemula-soft);}
  .level-tab.active-menengah{ border-color: var(--menengah); color: var(--menengah); background: var(--menengah-soft);}
  .level-tab.active-lanjut{ border-color: var(--lanjut); color: var(--lanjut); background: var(--lanjut-soft);}
  .yours-tag{
    font-size: 9px; background: var(--brand); color:#10151C; padding:2px 6px; border-radius:999px;
    margin-left:6px; vertical-align:middle; font-weight:700;
  }

  .track-header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 22px; flex-wrap:wrap; gap:10px;}
  .track-header h2{ margin:0 0 4px; font-size:20px;}
  .track-header p{ margin:0; color:var(--text-muted); font-size:13px;}
  .progress-pill{
    background: var(--surface); border:1px solid var(--border); border-radius:999px; padding: 8px 16px;
    font-size:12.5px; color: var(--text-muted); display:flex; align-items:center; gap:8px;
  }
  .progress-pill b{ color: var(--text); font-family:'IBM Plex Mono',monospace;}

  .track-wrap{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding: 46px 30px 30px; margin-bottom: 22px; position:relative; overflow:hidden;
  }
  .track-line{
    position:absolute; left:6%; right:6%; top: 84px; height:0;
    border-top: 3px dashed var(--border); z-index:0;
  }
  .track-nodes{ display:flex; justify-content:space-between; position:relative; z-index:1; gap: 8px; }
  .track-node{ display:flex; flex-direction:column; align-items:center; width: 22%; cursor:pointer; }
  .track-node:nth-child(odd) .node-circle{ transform: translateY(-16px); }
  .track-node:nth-child(even) .node-circle{ transform: translateY(16px); }
  .node-circle{
    width: 54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size: 18px; font-weight:700; font-family:'Space Grotesk',sans-serif;
    border: 2px solid var(--border); background: var(--surface-2); color: var(--text-dim);
    transition: all .15s ease;
  }
  .track-node.unlocked .node-circle{ border-color: var(--node-color); color: var(--node-color); background: var(--surface); }
  .track-node.current .node-circle{ background: var(--node-color); color:#0B0F14; box-shadow: 0 0 0 5px var(--node-glow); }
  .track-node.completed .node-circle{ background: var(--node-color); color:#0B0F14; }
  .track-node.locked .node-circle{ opacity: .5; }
  .node-label{ margin-top: 20px; font-size: 11.5px; text-align:center; color: var(--text-muted); font-weight:600; line-height:1.3; max-width: 100px;}
  .track-node.current .node-label, .track-node.completed .node-label{ color: var(--text); }
  .node-num{ font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:4px;}

  /* Challenge panel */
  .challenge-panel{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding: 26px 28px; animation: fadeIn .2s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .ch-eyebrow{ font-size:11px; color: var(--node-color); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin-bottom:6px;}
  .ch-title{ font-size: 18px; font-weight:700; margin: 0 0 16px;}

  .hint-box{
    background: #0B0F14; border-left: 3px solid var(--error); border-radius: 8px; padding: 13px 16px;
    margin: 16px 0; font-size: 12.5px; color: #D8B9AF;
  }
  .hint-box .hb-title{ color: var(--error); font-weight:600; margin-bottom:4px; display:block; font-family:'IBM Plex Mono',monospace; font-size:11.5px;}

  .success-box{
    background: var(--pemula-soft); border-left: 3px solid var(--pemula); border-radius: 8px; padding: 16px 18px;
    margin-top: 16px;
  }
  .success-box .sb-title{ color: var(--pemula); font-weight:700; font-size:14px; margin-bottom:4px; display:block;}
  .success-box p{ margin:0; font-size:12.5px; color:var(--text-muted);}

  .ch-footer-note{
    margin-top:20px; padding-top:16px; border-top:1px dashed var(--border);
    font-size:11.5px; color: var(--text-dim); font-style:italic;
  }
  .ch-actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}

  /* Teacher dashboard */
  .dash-grid{ display:grid; grid-template-columns: 1.5fr 1fr; gap:18px; margin-bottom:18px;}
  @media (max-width: 780px){ .dash-grid{ grid-template-columns: 1fr; } .feature-row{ grid-template-columns:1fr;} }

  .student-card{
    background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px;
    display:flex; align-items:center; gap:14px; margin-bottom: 10px;
  }
  .avatar{
    width:40px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; color:#0B0F14;
  }
  .student-info{ flex:1; min-width:0; }
  .student-name{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .student-note{ font-size:11.5px; color: var(--text-dim); margin-top:3px;}
  .bar-track{ background: var(--surface-2); height:6px; border-radius:4px; overflow:hidden; margin-top:8px; width:100%;}
  .bar-fill{ height:100%; border-radius:4px;}
  .status-badge{ font-size:10.5px; padding:3px 9px; border-radius:999px; font-weight:700; white-space:nowrap;}
  .status-tuntas{ background: var(--pemula-soft); color:var(--pemula);}
  .status-berjalan{ background: var(--menengah-soft); color:var(--menengah);}
  .status-tertahan{ background: var(--error-soft); color:var(--error);}

  .panel-title{ font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:14px;}

  .struggle-item{ margin-bottom:14px; }
  .struggle-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;}
  .struggle-top b{ font-family:'IBM Plex Mono',monospace; color: var(--menengah);}

  .stat-strip{ display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-bottom:18px;}
  .stat-box{ background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;}
  .stat-num{ font-size:24px; font-weight:700; color: var(--brand);}
  .stat-label{ font-size:11.5px; color:var(--text-muted); margin-top:2px;}

  .footer-note{ text-align:center; color: var(--text-dim); font-size:11.5px; margin-top: 30px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const CHALLENGES = {
  pemula: {
    label: "Pemula", color: "var(--pemula)", glow: "rgba(79,191,174,0.25)", key: "pemula",
    items: [
      { title:"Variabel & Tipe Data",
        code:`<span class="kw">let</span> nama = <span class="str">"Rani"</span>;\n<span class="kw">let</span> umur = 17;\nconsole.log(nama + <span class="str">" berumur "</span> + umur + <span class="str">" tahun"</span>);`,
        q:"Apa tipe data dari variabel umur pada kode di atas?",
        options:["String","Number","Boolean","Array"], correct:1,
        hints:["Perhatikan nilai 17 — apakah diapit tanda kutip atau tidak?","Nilai tanpa tanda kutip di JavaScript termasuk tipe data angka (Number)."] },
      { title:"Operator Aritmatika",
        code:`<span class="kw">let</span> a = 8;\n<span class="kw">let</span> b = 3;\n<span class="kw">let</span> hasil = a % b;\nconsole.log(hasil);`,
        q:"Berapa nilai hasil yang tercetak?",
        options:["2","2.67","5","11"], correct:0,
        hints:["Simbol % disebut operator modulus, hasilnya adalah sisa pembagian.","8 dibagi 3 = 2 sisa 2 — sisa itulah yang dicetak."] },
      { title:"Percabangan Dasar",
        code:`<span class="kw">let</span> nilai = 65;\n<span class="kw">if</span> (nilai >= 60) {\n  console.log(<span class="str">"Lulus"</span>);\n}`,
        q:"Apa yang akan dicetak program di atas?",
        options:['"Lulus"',"Tidak ada output","Error",'"60"'], correct:0,
        hints:["Cek dulu apakah kondisi nilai >= 60 bernilai benar untuk nilai 65.","65 lebih besar dari 60, jadi kondisi if terpenuhi."] },
      { title:"Proyek Mini: Kalkulator",
        code:`<span class="kw">function</span> tambah(a, b) {\n  <span class="kw">return</span> a + b;\n}\nconsole.log(tambah(4, 5));`,
        q:"Fungsi tambah(4, 5) akan menghasilkan nilai berapa?",
        options:["9","45",'"45"',"Error"], correct:0,
        hints:["Fungsi ini menjumlahkan dua parameter yang diberikan.","4 + 5 = 9, bukan digabung sebagai teks."] },
    ]
  },
  menengah: {
    label: "Menengah", color: "var(--menengah)", glow:"rgba(232,162,60,0.25)", key:"menengah",
    items: [
      { title:"Percabangan Lanjut",
        code:`<span class="kw">let</span> suhu = 30;\n<span class="kw">if</span> (suhu > 35) {\n  console.log(<span class="str">"Panas"</span>);\n} <span class="kw">else if</span> (suhu > 25) {\n  console.log(<span class="str">"Hangat"</span>);\n} <span class="kw">else</span> {\n  console.log(<span class="str">"Sejuk"</span>);\n}`,
        q:"Apa output program di atas?",
        options:['"Panas"','"Hangat"','"Sejuk"',"Error"], correct:1,
        hints:["Cek kondisi pertama dulu: apakah 30 > 35?","Karena kondisi pertama salah, program mengecek kondisi kedua: 30 > 25 — ini benar."] },
      { title:"Perulangan (for)",
        code:`<span class="kw">let</span> hasil = <span class="str">""</span>;\n<span class="kw">for</span> (<span class="kw">let</span> i = 1; i <= 3; i++) {\n  hasil += i + <span class="str">","</span>;\n}\nconsole.log(hasil);`,
        q:"Apa nilai hasil yang tercetak?",
        options:['"1,2,3,"','"1,2,3"','"123"','"0,1,2,"'], correct:0,
        hints:["Perulangan berjalan dari i=1 sampai i=3.","Setiap putaran menambahkan angka i lalu tanda koma ke variabel hasil."] },
      { title:"Array Dasar",
        code:`<span class="kw">let</span> buah = [<span class="str">"Apel"</span>, <span class="str">"Jeruk"</span>, <span class="str">"Mangga"</span>];\nconsole.log(buah[1]);`,
        q:"Apa yang tercetak dari kode di atas?",
        options:['"Apel"','"Jeruk"','"Mangga"',"undefined"], correct:1,
        hints:["Indeks array dimulai dari angka 0, bukan 1.","buah[0] adalah Apel, buah[1] adalah Jeruk."] },
      { title:"Proyek Mini: To-Do List",
        code:`<span class="kw">let</span> tugas = [<span class="str">"Belajar"</span>, <span class="str">"Olahraga"</span>];\ntugas.push(<span class="str">"Istirahat"</span>);\nconsole.log(tugas.length);`,
        q:"Berapa panjang array tugas setelah baris kedua dijalankan?",
        options:["2","3","4","Error"], correct:1,
        hints:["Method push() menambahkan satu elemen baru ke akhir array.","Array awalnya 2 elemen, setelah push jadi 3 elemen."] },
    ]
  },
  lanjut: {
    label: "Lanjut", color: "var(--lanjut)", glow:"rgba(185,140,224,0.25)", key:"lanjut",
    items: [
      { title:"Fungsi & Parameter Default",
        code:`<span class="kw">function</span> sapa(nama = <span class="str">"Sobat"</span>) {\n  <span class="kw">return</span> <span class="str">"Halo, "</span> + nama + <span class="str">"!"</span>;\n}\nconsole.log(sapa());`,
        q:"Apa output dari kode di atas?",
        options:['"Halo, Sobat!"','"Halo, undefined!"',"Error",'"Halo, !"'], correct:0,
        hints:["Parameter nama punya nilai default 'Sobat' jika tidak diisi.","Fungsi dipanggil tanpa argumen, jadi nilai default yang dipakai."] },
      { title:"Array Method: filter()",
        code:`<span class="kw">let</span> angka = [4, 7, 10, 13, 16];\n<span class="kw">let</span> genap = angka.filter(n => n % 2 === 0);\nconsole.log(genap);`,
        q:"Apa isi array genap setelah kode dijalankan?",
        options:["[4, 10, 16]","[7, 13]","[4, 7, 10, 13, 16]","[ ]"], correct:0,
        hints:["filter() menyaring elemen yang membuat kondisi bernilai true.","n % 2 === 0 berarti mengambil angka yang habis dibagi 2 (genap)."] },
      { title:"Studi Kasus Debugging",
        code:`<span class="kw">function</span> rataRata(nilai) {\n  <span class="kw">let</span> total = 0;\n  <span class="kw">for</span> (<span class="kw">let</span> i = 0; i <= nilai.length; i++) {\n    total += nilai[i];\n  }\n  <span class="kw">return</span> total / nilai.length;\n}\nconsole.log(rataRata([80, 90, 70]));`,
        q:"Kode di atas mengandung bug. Apa penyebabnya?",
        options:["Kondisi perulangan seharusnya i < nilai.length","Variabel total tidak perlu diinisialisasi","Fungsi tidak boleh pakai return","Array nilai ditulis dengan format salah"], correct:0,
        hints:["Coba telusuri: apa yang terjadi saat i sama dengan nilai.length?","Saat i = nilai.length, nilai[i] bernilai undefined dan merusak hasil penjumlahan."] },
      { title:"Proyek Akhir: Tebak Angka",
        code:`<span class="kw">let</span> rahasia = 7;\n<span class="kw">let</span> tebakan = 7;\n<span class="kw">if</span> (tebakan === rahasia) {\n  console.log(<span class="str">"Menang!"</span>);\n} <span class="kw">else if</span> (tebakan < rahasia) {\n  console.log(<span class="str">"Terlalu kecil"</span>);\n} <span class="kw">else</span> {\n  console.log(<span class="str">"Terlalu besar"</span>);\n}`,
        q:"Apa output program di atas?",
        options:['"Menang!"','"Terlalu kecil"','"Terlalu besar"',"Error"], correct:0,
        hints:["Bandingkan nilai tebakan dan rahasia terlebih dahulu.","Karena tebakan sama persis dengan rahasia (7 === 7), kondisi pertama terpenuhi."] },
    ]
  }
};

const DIAGNOSTIC = [
  { code:`<span class="kw">let</span> nama = <span class="str">"Budi"</span>;`,
    q:"Manakah cara benar mendeklarasikan variabel di JavaScript?",
    options:['let nama = "Budi";','variabel nama = "Budi";','nama := "Budi";','set nama = "Budi";'], correct:0 },
  { code:`<span class="kw">let</span> nilai = 75;\n<span class="kw">if</span> (nilai >= 80) {\n  console.log(<span class="str">"A"</span>);\n} <span class="kw">else if</span> (nilai >= 70) {\n  console.log(<span class="str">"B"</span>);\n} <span class="kw">else</span> {\n  console.log(<span class="str">"C"</span>);\n}`,
    q:"Apa hasil program di atas jika nilai = 75?",
    options:['"A"','"B"','"C"',"Error"], correct:1 },
  { code:`<span class="kw">let</span> total = 0;\n<span class="kw">for</span> (<span class="kw">let</span> i = 1; i <= 5; i++) {\n  total += i;\n}\nconsole.log(total);`,
    q:"Berapa nilai total yang tercetak?",
    options:["10","15","20","5"], correct:1 },
];

const STUDENTS = [
  { name:"Dimas P.", level:"lanjut", progress:100, attempts:1.2, status:"tuntas", note:"Konsisten menyelesaikan tanpa banyak percobaan ulang." },
  { name:"Salsa A.", level:"lanjut", progress:75, attempts:1.8, status:"berjalan", note:"Tertahan sejenak di studi kasus debugging." },
  { name:"Fajar R.", level:"menengah", progress:100, attempts:1.5, status:"tuntas", note:"Menyelesaikan seluruh checkpoint tepat waktu." },
  { name:"Nabila K.", level:"menengah", progress:50, attempts:3.1, status:"tertahan", note:"Sering tertahan di materi Perulangan (for) — butuh pendampingan." },
  { name:"Yusuf H.", level:"pemula", progress:75, attempts:2.0, status:"berjalan", note:"Progres stabil, percaya diri meningkat sejak checkpoint 2." },
  { name:"Citra M.", level:"pemula", progress:25, attempts:3.4, status:"tertahan", note:"Butuh pendampingan langsung di materi Percabangan Dasar." },
];

const STRUGGLE = [
  { topic:"Perulangan (for)", pct:65 },
  { topic:"Studi Kasus Debugging", pct:55 },
  { topic:"Percabangan Lanjut (if-else if)", pct:40 },
  { topic:"Array Method (filter)", pct:35 },
];

let state = {
  role: "siswa",
  view: "landing",
  showInfo: false,
  diagStep: 0,
  diagCorrect: 0,
  diagPicked: null,
  assignedLevel: null,
  activeLevel: null,
  openChallenge: null,
  challengeState: {},
  pickedOption: null,
  submitted: false,
};

function key(level, idx){ return level + "-" + idx; }
function getCh(level, idx){ return state.challengeState[key(level, idx)] || { completed:false, attempts:0, hintIdx:-1 }; }
function setCh(level, idx, patch){
  const k = key(level, idx);
  state.challengeState[k] = { ...getCh(level, idx), ...patch };
}
function levelProgress(level){
  const items = CHALLENGES[level].items;
  let done = 0;
  items.forEach((_,i)=>{ if(getCh(level,i).completed) done++; });
  return { done, total: items.length };
}
function isUnlocked(level, idx){
  if(idx === 0) return true;
  return getCh(level, idx-1).completed;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = topbar() + (state.showInfo ? infoPanel() : "") + body();
}

function topbar(){
  return `
  <div class="topbar">
    <div class="brandmark">
      <div class="dot">CT</div>
      <div class="brand">CodeTrack<span>Karya Inovasi Pendidikan — PPG</span></div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="nav">
        <button class="nav-pill ${state.role==='siswa'?'active':''}" data-action="setRole" data-role="siswa">Tampilan Siswa</button>
        <button class="nav-pill ${state.role==='guru'?'active':''}" data-action="setRole" data-role="guru">Dashboard Guru</button>
      </div>
      <button class="info-btn" data-action="toggleInfo" title="Info karya inovasi">i</button>
    </div>
  </div>`;
}

function infoPanel(){
  return `
  <div class="info-panel">
    <h3>Tentang Karya Inovasi Ini</h3>
    <p style="margin:0; font-size:13px; color:var(--text-muted);">CodeTrack dirancang berdasarkan hasil refleksi pengalaman belajar Pembelajaran Berdiferensiasi, Growth Mindset, dan Asesmen selama Program PPG, untuk menjawab tantangan nyata: kesenjangan kemampuan siswa yang lebar dalam satu kelas PPLG.</p>
    <div class="info-grid">
      <div class="info-card"><div class="eyebrow">Kebaruan</div><p>Memadukan jalur belajar adaptif dengan umpan balik bergaya growth mindset, dirancang khusus konteks SMK PPLG.</p></div>
      <div class="info-card"><div class="eyebrow">Kreativitas</div><p>Menggabungkan latar belakang developer dengan teori pedagogik yang dipelajari selama PPG.</p></div>
      <div class="info-card"><div class="eyebrow">Relevansi</div><p>Sesuai kurikulum produktif PPLG dan karakteristik siswa dengan kemampuan awal beragam.</p></div>
      <div class="info-card"><div class="eyebrow">Kebermanfaatan</div><p>Membantu guru memantau progres individual tanpa memeriksa manual satu per satu.</p></div>
      <div class="info-card"><div class="eyebrow">Efektivitas</div><p>Diuji cobakan terbatas pada kelas PPL — diukur dari penyelesaian latihan &amp; motivasi siswa.</p></div>
    </div>
  </div>`;
}

function body(){
  if(state.role === 'guru') return teacherView();
  if(state.view === 'landing') return landingView();
  if(state.view === 'diagnostic') return diagnosticView();
  if(state.view === 'result') return resultView();
  if(state.view === 'track') return trackView();
  return landingView();
}

function landingView(){
  return `
  <div class="hero">
    <div class="eyebrow">Platform Pembelajaran Adaptif</div>
    <h1>Belajar coding sesuai levelmu sendiri, bukan level rata-rata kelas.</h1>
    <p>CodeTrack memetakan kemampuan awalmu lewat tes penempatan singkat, lalu menyusun jalur belajar checkpoint demi checkpoint — lengkap dengan umpan balik yang membantumu belajar dari kesalahan, bukan takut padanya.</p>
    <button class="btn-primary" data-action="startDiagnostic">Mulai Tes Penempatan →</button>
  </div>
  <div class="feature-row">
    <div class="feature"><span class="icon">🎯</span><h4>Penempatan Otomatis</h4><p>Tiga soal singkat menentukan jalur belajar paling pas untukmu.</p></div>
    <div class="feature"><span class="icon">🧭</span><h4>Jalur Checkpoint</h4><p>Belajar bertahap lewat rangkaian tantangan yang saling terhubung.</p></div>
    <div class="feature"><span class="icon">🌱</span><h4>Umpan Balik Bertumbuh</h4><p>Salah jawaban bukan akhir — ada petunjuk bertahap yang menuntunmu.</p></div>
  </div>`;
}

function diagnosticView(){
  const total = DIAGNOSTIC.length;
  const q = DIAGNOSTIC[state.diagStep];
  const dots = DIAGNOSTIC.map((_,i)=>{
    let cls = 'diag-dot';
    if(i < state.diagStep) cls += ' done';
    else if(i === state.diagStep) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  const picked = state.diagPicked;
  const submitted = state.submitted;

  const opts = q.options.map((opt,i)=>{
    let cls = 'opt';
    if(submitted){
      if(i === q.correct) cls += ' correct';
      else if(i === picked) cls += ' wrong';
      else cls += ' disabled';
    }
    const letter = String.fromCharCode(65+i);
    return `<button class="${cls}" data-action="pickDiag" data-idx="${i}" ${submitted?'disabled':''}>
      <span class="letter">${letter}</span><span>${opt}</span>
    </button>`;
  }).join('');

  return `
  <div class="card">
    <div class="diag-step-label">Tes Penempatan · Soal ${state.diagStep+1} dari ${total}</div>
    <div class="diag-progress">${dots}</div>
    <div class="codeblock">${q.code}</div>
    <div class="q-text">${q.q}</div>
    <div class="opt-list">${opts}</div>
    ${submitted ? `<div class="ch-actions"><button class="btn-primary" data-action="nextDiag">${state.diagStep+1 < total ? 'Lanjut Soal Berikutnya →' : 'Lihat Hasil Penempatan →'}</button></div>` : ''}
  </div>`;
}

function resultView(){
  const level = state.assignedLevel;
  const info = CHALLENGES[level];
  const reasoning = level === 'lanjut'
    ? "Kamu menjawab benar seluruh soal logika pemrograman, termasuk perulangan — jalur Lanjut akan langsung mengasah kemampuan fungsi, array, dan debugging."
    : level === 'menengah'
    ? "Kamu sudah cukup kuat di variabel dan percabangan, namun masih perlu penguatan di perulangan dan array — jalur Menengah dirancang untuk itu."
    : "Kamu akan memulai dari dasar-dasar seperti variabel, operator, dan percabangan agar fondasi logikamu kuat sebelum lanjut ke materi yang lebih kompleks.";

  return `
  <div class="card level-${level}">
    <div class="result-badge">Hasil Penempatan</div>
    <h2 style="margin:0 0 10px; font-size:24px;">Kamu ditempatkan di jalur <span style="color:${info.color}">${info.label}</span></h2>
    <p style="color:var(--text-muted); font-size:13.5px; max-width:480px; margin-bottom:22px;">${reasoning}</p>
    <button class="btn-primary" data-action="goTrack" data-level="${level}">Mulai Belajar di Jalur ${info.label} →</button>
  </div>`;
}

function trackView(){
  const level = state.activeLevel || state.assignedLevel || 'pemula';
  const info = CHALLENGES[level];
  const prog = levelProgress(level);

  const tabs = Object.keys(CHALLENGES).map(k=>{
    const active = k === level;
    return `<button class="level-tab ${active ? 'active-'+k : ''}" data-action="switchLevel" data-level="${k}">
      ${CHALLENGES[k].label}${state.assignedLevel===k ? '<span class="yours-tag">Level Kamu</span>' : ''}
    </button>`;
  }).join('');

  const nodes = info.items.map((item, idx)=>{
    const st = getCh(level, idx);
    const unlocked = isUnlocked(level, idx);
    let cls = 'track-node';
    if(!unlocked) cls += ' locked';
    else if(st.completed) cls += ' completed';
    else cls += ' unlocked';
    if(state.openChallenge && state.openChallenge.level===level && state.openChallenge.idx===idx) cls += ' current';

    const icon = st.completed ? '✓' : (idx+1);
    return `<div class="${cls}" style="--node-color:${info.color}; --node-glow:${info.glow};" data-action="${unlocked?'openChallenge':'lockedNote'}" data-level="${level}" data-idx="${idx}">
      <div class="node-circle">${icon}</div>
      <div class="node-label">${item.title}</div>
      <div class="node-num">Checkpoint ${idx+1}</div>
    </div>`;
  }).join('');

  let panel = '';
  if(state.openChallenge && state.openChallenge.level === level){
    panel = challengePanel(level, state.openChallenge.idx);
  }

  return `
  <div class="level-tabs">${tabs}</div>
  <div class="track-header">
    <div>
      <h2>Jalur ${info.label}</h2>
      <p>Selesaikan checkpoint secara berurutan untuk membuka tantangan berikutnya.</p>
    </div>
    <div class="progress-pill">Progres: <b>${prog.done}/${prog.total}</b> checkpoint</div>
  </div>
  <div class="track-wrap">
    <div class="track-line"></div>
    <div class="track-nodes">${nodes}</div>
  </div>
  ${panel}
  `;
}

function challengePanel(level, idx){
  const info = CHALLENGES[level];
  const item = info.items[idx];
  const st = getCh(level, idx);
  const picked = state.pickedOption;
  const submitted = state.submitted;
  const isCorrect = submitted && picked === item.correct;
  const isWrong = submitted && picked !== item.correct;

  const opts = item.options.map((opt,i)=>{
    let cls = 'opt';
    if(isCorrect && i === item.correct) cls += ' correct';
    if(isWrong){
      if(i === picked) cls += ' wrong';
      else cls += ' disabled';
    }
    if(isCorrect && i !== item.correct) cls += ' disabled';
    const letter = String.fromCharCode(65+i);
    return `<button class="${cls}" data-action="pickChallenge" data-idx="${i}" ${submitted && !isWrong ? 'disabled':''} ${isCorrect?'disabled':''}>
      <span class="letter">${letter}</span><span>${opt}</span>
    </button>`;
  }).join('');

  let feedback = '';
  if(isWrong){
    const hintIdx = Math.min(st.hintIdx, item.hints.length - 1);
    const hint = item.hints[hintIdx] || "Diskusikan bersama teman satu kelompok atau tanyakan ke guru untuk petunjuk lebih lanjut.";
    feedback = `
    <div class="hint-box">
      <span class="hb-title">// belum berhasil — percobaan ke-${st.attempts}</span>
      ${hint}
    </div>
    <div class="ch-actions">
      <button class="btn-primary" data-action="retryChallenge" data-level="${level}" data-idx="${idx}">Coba Lagi</button>
    </div>`;
  } else if(isCorrect){
    const nextIdx = idx+1;
    const hasNext = nextIdx < info.items.length;
    feedback = `
    <div class="success-box">
      <span class="sb-title">✓ Berhasil!</span>
      <p>Logikamu tepat. ${st.attempts > 1 ? 'Butuh beberapa percobaan, dan itu bagian normal dari proses belajar.' : 'Langsung tepat di percobaan pertama — mantap!'}</p>
    </div>
    <div class="ch-actions">
      ${hasNext ? `<button class="btn-primary" data-action="openChallenge" data-level="${level}" data-idx="${nextIdx}">Lanjut ke Checkpoint Berikutnya →</button>` : `<button class="btn-primary" data-action="closeChallenge">Jalur ${info.label} Selesai! Kembali ke Track</button>`}
      <button class="btn-secondary" data-action="closeChallenge">Tutup</button>
    </div>`;
  } else {
    feedback = `<div class="ch-actions"><button class="btn-primary" data-action="submitChallenge" ${picked===null?'disabled':''}>Periksa Jawaban</button></div>`;
  }

  return `
  <div class="challenge-panel" style="--node-color:${info.color}">
    <div class="ch-eyebrow">Checkpoint ${idx+1} · Jalur ${info.label}</div>
    <div class="ch-title">${item.title}</div>
    <div class="codeblock">${item.code}</div>
    <div class="q-text" style="font-size:15px;">${item.q}</div>
    <div class="opt-list">${opts}</div>
    ${feedback}
    <div class="ch-footer-note">Error adalah bagian dari proses belajar — bukan tanda kegagalan.</div>
  </div>`;
}

function teacherView(){
  const avgProgress = Math.round(STUDENTS.reduce((a,s)=>a+s.progress,0)/STUDENTS.length);
  const tuntas = STUDENTS.filter(s=>s.status==='tuntas').length;
  const tertahan = STUDENTS.filter(s=>s.status==='tertahan').length;

  const stat = `
  <div class="stat-strip">
    <div class="stat-box"><div class="stat-num">${avgProgress}%</div><div class="stat-label">Rata-rata progres kelas</div></div>
    <div class="stat-box"><div class="stat-num">${tuntas}/${STUDENTS.length}</div><div class="stat-label">Siswa tuntas jalur saat ini</div></div>
    <div class="stat-box"><div class="stat-num">${tertahan}</div><div class="stat-label">Siswa butuh pendampingan</div></div>
  </div>`;

  const students = STUDENTS.map(s=>{
    const info = CHALLENGES[s.level];
    const initials = s.name.split(' ').map(w=>w[0]).join('').slice(0,2);
    const statusLabel = s.status==='tuntas' ? 'Tuntas' : s.status==='berjalan' ? 'Berjalan' : 'Tertahan';
    return `
    <div class="student-card">
      <div class="avatar" style="background:${info.color}">${initials}</div>
      <div class="student-info">
        <div class="student-name">${s.name}
          <span class="badge badge-${s.level}" style="padding:2px 9px; border-radius:999px; font-size:10.5px; font-weight:700;">${info.label}</span>
          <span class="status-badge status-${s.status}">${statusLabel}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${s.progress}%; background:${info.color};"></div></div>
        <div class="student-note">${s.note}</div>
      </div>
    </div>`;
  }).join('');

  const struggle = STRUGGLE.map(s=>`
    <div class="struggle-item">
      <div class="struggle-top"><span>${s.topic}</span><b>${s.pct}%</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%; background:var(--menengah);"></div></div>
    </div>`).join('');

  return `
  ${stat}
  <div class="dash-grid">
    <div>
      <div class="panel-title">Progres Siswa (Kelas X PPLG)</div>
      ${students}
    </div>
    <div class="card" style="padding:20px;">
      <div class="panel-title">Titik Kesulitan Umum</div>
      <p style="font-size:11.5px; color:var(--text-dim); margin:-6px 0 16px;">% siswa yang butuh lebih dari 2 percobaan</p>
      ${struggle}
    </div>
  </div>
  <div class="footer-note">Data pada dashboard ini adalah simulasi untuk keperluan demonstrasi karya inovasi.</div>
  `;
}

/* ---- event handling ---- */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action === 'setRole'){ state.role = el.dataset.role; }
  else if(action === 'toggleInfo'){ state.showInfo = !state.showInfo; }
  else if(action === 'startDiagnostic'){
    state.view='diagnostic'; state.diagStep=0; state.diagCorrect=0; state.diagPicked=null; state.submitted=false;
  }
  else if(action === 'pickDiag'){
    if(state.submitted) return;
    const idx = parseInt(el.dataset.idx);
    state.diagPicked = idx; state.submitted = true;
    if(idx === DIAGNOSTIC[state.diagStep].correct) state.diagCorrect++;
  }
  else if(action === 'nextDiag'){
    if(state.diagStep + 1 < DIAGNOSTIC.length){
      state.diagStep++; state.diagPicked=null; state.submitted=false;
    } else {
      const c = state.diagCorrect;
      state.assignedLevel = c >= 3 ? 'lanjut' : c === 2 ? 'menengah' : 'pemula';
      state.view = 'result';
    }
  }
  else if(action === 'goTrack'){
    state.activeLevel = el.dataset.level; state.view='track'; state.openChallenge=null;
  }
  else if(action === 'switchLevel'){
    state.activeLevel = el.dataset.level; state.openChallenge=null;
  }
  else if(action === 'openChallenge'){
    const level = el.dataset.level, idx = parseInt(el.dataset.idx);
    state.openChallenge = { level, idx };
    state.pickedOption = null; state.submitted = false;
  }
  else if(action === 'lockedNote'){
    // no-op, node is locked
  }
  else if(action === 'pickChallenge'){
    if(state.submitted) return;
    state.pickedOption = parseInt(el.dataset.idx);
  }
  else if(action === 'submitChallenge'){
    const { level, idx } = state.openChallenge;
    const item = CHALLENGES[level].items[idx];
    const st = getCh(level, idx);
    const attempts = st.attempts + 1;
    state.submitted = true;
    if(state.pickedOption === item.correct){
      setCh(level, idx, { completed:true, attempts });
    } else {
      const hintIdx = Math.min(attempts - 1, item.hints.length - 1);
      setCh(level, idx, { attempts, hintIdx });
    }
  }
  else if(action === 'retryChallenge'){
    state.pickedOption = null; state.submitted = false;
  }
  else if(action === 'closeChallenge'){
    state.openChallenge = null;
  }

  render();
});

render();
</script>
</body>
</html>
